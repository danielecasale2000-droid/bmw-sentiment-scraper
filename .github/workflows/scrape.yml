name: Scraper commenti live

# Esegue lo scraping ogni 30 minuti + avvio manuale dal telefono
# (tab Actions del repo -> Scraper commenti live -> Run workflow)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright firebase-admin google-api-python-client
          playwright install chromium --with-deps

      - name: Create Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      # --- YOUTUBE: fonte gratuita e senza blocchi, via API ufficiale ---
      # Un video = un modello specifico. Non riusare mai lo stesso video ID
      # sotto un --model diverso: creerebbe etichette sbagliate su Firestore.

      - name: Run YouTube fetcher BMW X5
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python youtube_firestore.py --model "BMW X5"
          --video-ids iNhLIrK_xoU
        continue-on-error: true

      - name: Run YouTube fetcher BMW i7
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python youtube_firestore.py --model "BMW i7"
          --video-ids IBqtfZIeFK8
        continue-on-error: true

      - name: Run YouTube fetcher BMW i3
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python youtube_firestore.py --model "BMW i3"
          --video-ids YcCCbAmf_XI
        continue-on-error: true

      - name: Run YouTube fetcher BMW iX3
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python youtube_firestore.py --model "BMW iX3"
          --video-ids hovl1LbuTjc
        continue-on-error: true

      - name: Run YouTube fetcher BMW i4
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python youtube_firestore.py --model "BMW i4"
          --video-ids=-SbbyrUv9tY
        continue-on-error: true

      # --- QUATTRORUOTE: lasciato attivo, ma sappiamo che al momento
      # si scontra con un muro anti-adblock e restituirà 0 commenti ---
      - name: Run scraper BMW X5 (Quattroruote)
        run: python scraper_firestore.py --model "BMW X5" --urls urls.txt
        continue-on-error: true

      - name: Cleanup key
        if: always()
        run: rm -f serviceAccountKey.json
