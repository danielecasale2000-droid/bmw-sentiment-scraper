name: Scraper competitor (YouTube)

# Esegue lo scraping dei 61 modelli competitor in PARALLELO (matrix),
# molto piu' veloce di 61 step in sequenza in un solo job.
# Ogni job richiede solo google-api-python-client + firebase-admin,
# niente Playwright/Chromium: sono job leggeri (~20-30s ciascuno).
# Usa --video-ids-csv (ID separati da virgola in una stringa unica)
# invece di --video-ids: evita qualsiasi ambiguita' con argparse quando
# un ID inizia per '-' o quando un modello ha piu' di un video sorgente.
on:
  schedule:
    - cron: '0 3 * * *'   # 1 volta al giorno (03:00 UTC), sfasato di 1h dallo scrape BMW
                          # per non concentrare tutte le letture Firestore nello stesso momento.
  workflow_dispatch:

jobs:
  scrape-competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
          - model: "Avatr 12"
            video_ids_csv: "H7x_TtJtLB8"
          - model: "BYD Atto 2 DM-i"
            video_ids_csv: "e6FDDtu2NWQ"
