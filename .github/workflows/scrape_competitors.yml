    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin google-api-python-client

      - name: Create Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Run YouTube fetcher
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: >
          python youtube_firestore.py --model "${{ matrix.model }}"
          --video-ids-csv="${{ matrix.video_ids_csv }}"
        continue-on-error: true

      - name: Cleanup key
        if: always()
        run: rm -f serviceAccountKey.json
