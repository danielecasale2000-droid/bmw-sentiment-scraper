name: Riassunti AI (Gemini)

# Genera i riassunti AI di alta qualità per ogni modello e li salva su
# Firestore, usando l'API GRATUITA di Google Gemini. Gira 1 volta al
# giorno (i commenti non cambiano di continuo) + avvio manuale.
on:
  schedule:
    - cron: '0 6 * * *'   # ogni giorno alle 06:00 UTC
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai firebase-admin

      - name: Create Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Generate AI summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u ai_summaries.py --min-comments 5

      - name: Cleanup key
        if: always()
        run: rm -f serviceAccountKey.json
